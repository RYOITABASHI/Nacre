name: Build Android APK

on:
  push:
    branches:
      - main
      - codex/**
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Clone KenLM source for native build
        run: |
          git clone --depth 1 https://github.com/kpu/kenlm.git /tmp/kenlm-src
          mkdir -p ime-ai/src/main/cpp/kenlm
          cp -r /tmp/kenlm-src/lm ime-ai/src/main/cpp/kenlm/
          cp -r /tmp/kenlm-src/util ime-ai/src/main/cpp/kenlm/

      - name: Clone llama.cpp source for native build
        run: |
          # Pin to b3500 (mid-July 2024) — matches the pre-sampler-chain API in
          # nacre_llama_jni.cpp (llama_load_model_from_file / llama_batch_add /
          # llama_sample_token_greedy). At this tag sources live under src/,
          # ggml/ and include/; CMakeLists expects a flat llama/ dir, so we
          # find-and-flatten below.
          git clone --depth 1 --branch b3500 https://github.com/ggerganov/llama.cpp.git /tmp/llama-src
          echo "--- source tree ---"
          ls /tmp/llama-src
          [ -d /tmp/llama-src/src ] && echo "src/:" && ls /tmp/llama-src/src
          [ -d /tmp/llama-src/ggml ] && echo "ggml/:" && ls /tmp/llama-src/ggml

          DEST=ime-ai/src/main/cpp/llama
          mkdir -p "$DEST"

          # Flatten llama.cpp core sources (src/ or root) into DEST.
          # Skip common/ — nacre_llama_jni.cpp only uses core llama APIs
          # (llama.h), never the helpers in common/.
          for name in llama.cpp llama-grammar.cpp llama-sampling.cpp llama-vocab.cpp \
                      unicode.cpp unicode-data.cpp; do
            f=$(find /tmp/llama-src -maxdepth 3 -name "$name" -type f -not -path "*/examples/*" -not -path "*/tests/*" | head -n1)
            if [ -n "$f" ]; then cp "$f" "$DEST/"; else echo "::warning::$name not found"; fi
          done

          # ggml sources (src/ or ggml/src or root). ggml-aarch64.c holds the
          # ARM64 SIMD kernels (quantize_q4_0_*, ggml_gemv/gemm_q4_0_*x*_q8_0);
          # without it the link step fails with undefined symbols.
          for name in ggml.c ggml-alloc.c ggml-backend.c ggml-quants.c ggml-aarch64.c; do
            f=$(find /tmp/llama-src -maxdepth 4 -name "$name" -type f | head -n1)
            if [ -n "$f" ]; then cp "$f" "$DEST/"; else echo "::warning::$name not found"; fi
          done

          # Headers — public ones live in include/ at b3500
          find /tmp/llama-src/include -maxdepth 2 -name "*.h" -exec cp {} "$DEST/" \; 2>/dev/null || true
          find /tmp/llama-src/src -maxdepth 2 -name "*.h" -exec cp {} "$DEST/" \; 2>/dev/null || true
          find /tmp/llama-src/ggml/include -maxdepth 2 -name "*.h" -exec cp {} "$DEST/" \; 2>/dev/null || true
          find /tmp/llama-src/ggml/src -maxdepth 2 -name "*.h" -exec cp {} "$DEST/" \; 2>/dev/null || true
          find /tmp/llama-src -maxdepth 1 -name "*.h" -exec cp {} "$DEST/" \; 2>/dev/null || true

          echo "--- llama/ contents ---"
          ls "$DEST/"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Remove Termux aapt2 override
        run: sed -i '/android.aapt2FromMavenOverride/d' gradle.properties

      - name: Configure release signing
        env:
          NACRE_RELEASE_KEYSTORE_BASE64: ${{ secrets.NACRE_RELEASE_KEYSTORE_BASE64 }}
          NACRE_RELEASE_STORE_PASSWORD: ${{ secrets.NACRE_RELEASE_STORE_PASSWORD }}
          NACRE_RELEASE_KEY_ALIAS: ${{ secrets.NACRE_RELEASE_KEY_ALIAS }}
          NACRE_RELEASE_KEY_PASSWORD: ${{ secrets.NACRE_RELEASE_KEY_PASSWORD }}
        run: |
          missing=0
          for name in \
            NACRE_RELEASE_KEYSTORE_BASE64 \
            NACRE_RELEASE_STORE_PASSWORD \
            NACRE_RELEASE_KEY_ALIAS \
            NACRE_RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::warning::${name} is not configured; CI will build but not upload an installable APK."
              missing=1
            fi
          done

          if [ "${missing}" -ne 0 ]; then
            echo "NACRE_SIGNED_APK=false" >> "${GITHUB_ENV}"
            exit 0
          fi

          echo "${NACRE_RELEASE_KEYSTORE_BASE64}" | base64 --decode > /tmp/nacre-release.jks
          {
            printf '%s\n' "storeFile=/tmp/nacre-release.jks"
            printf '%s\n' "storePassword=${NACRE_RELEASE_STORE_PASSWORD}"
            printf '%s\n' "keyAlias=${NACRE_RELEASE_KEY_ALIAS}"
            printf '%s\n' "keyPassword=${NACRE_RELEASE_KEY_PASSWORD}"
          } > signing.properties
          echo "NACRE_SIGNED_APK=true" >> "${GITHUB_ENV}"

      - name: Compute version code
        run: |
          # Monotonic per-run versionCode so the in-app updater can compare builds.
          # +100 keeps us clear of the legacy hand-set codes (<= 2).
          VC=$((100 + GITHUB_RUN_NUMBER))
          echo "NACRE_VERSION_CODE=${VC}" >> "${GITHUB_ENV}"
          echo "NACRE_VERSION_NAME=0.3.0" >> "${GITHUB_ENV}"
          echo "versionCode=${VC} versionName=0.3.0"

      - name: Build Nacre APK
        run: ./gradlew assembleNacre
        env:
          ENABLE_NDK: "true"
          NACRE_VERSION_CODE: ${{ env.NACRE_VERSION_CODE }}
          NACRE_VERSION_NAME: ${{ env.NACRE_VERSION_NAME }}

      - name: Verify native library included
        run: |
          echo "=== Checking for libnacre-ai.so ==="
          find app/build/outputs/apk/release -name "*.apk" -exec unzip -l {} \; | grep libnacre || echo "WARNING: libnacre-ai.so not found in APK"

      - name: Verify release APK signature
        if: env.NACRE_SIGNED_APK == 'true'
        run: |
          APK="$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)"
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort | tail -n 1)"
          "${APKSIGNER}" verify --print-certs "${APK}"

      - name: Upload Nacre APK
        if: env.NACRE_SIGNED_APK == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nacre-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish GitHub Release (in-app updater channel)
        if: env.NACRE_SIGNED_APK == 'true' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK="$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)"
          VC="${NACRE_VERSION_CODE}"
          ASSET="nacre-${VC}.apk"   # name parsed by UpdateChecker (nacre-<code>.apk)
          cp "${APK}" "${ASSET}"
          gh release create "build-${VC}" "${ASSET}" \
            --title "Nacre build ${VC}" \
            --notes "Automated build ${VC} from ${GITHUB_SHA::7} (${GITHUB_REF_NAME})" \
            --target "${GITHUB_SHA}" \
          || gh release upload "build-${VC}" "${ASSET}" --clobber
