name: Build Android APK

on:
  push:
    branches:
      - main
      - codex/**
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK (preinstalled on runner)
        run: |
          # android-actions/setup-android@v3 started failing in ~20s on current
          # runners (runs #267/#268, Nov 2026), before any project code runs, so
          # no build has completed since build 365 (Aug 2026). The ubuntu runner
          # image already ships an Android SDK — use it directly instead of
          # provisioning one through a third-party action.
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "${SDK_ROOT}/cmdline-tools/latest/bin" >> "${GITHUB_PATH}"
          echo "${SDK_ROOT}/platform-tools" >> "${GITHUB_PATH}"
          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "${SDKMANAGER}" ]; then
            echo "::error::sdkmanager not found at ${SDKMANAGER} — runner image no longer ships an Android SDK"
            exit 1
          fi
          yes | "${SDKMANAGER}" --sdk_root="${SDK_ROOT}" --licenses > /dev/null
          "${SDKMANAGER}" --sdk_root="${SDK_ROOT}" \
            "platform-tools" "platforms;android-34" "build-tools;35.0.0"

      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Clone KenLM source for native build
        run: |
          git clone --depth 1 https://github.com/kpu/kenlm.git /tmp/kenlm-src
          mkdir -p ime-ai/src/main/cpp/kenlm
          cp -r /tmp/kenlm-src/lm ime-ai/src/main/cpp/kenlm/
          cp -r /tmp/kenlm-src/util ime-ai/src/main/cpp/kenlm/

      - name: Clone llama.cpp source for native build
        run: |
          # Pin: tools/llama-pin.txt (b12381; was b3500 in-workflow). The
          # tree is copied whole and built via upstream's own CMake
          # (add_subdirectory in ime-ai/src/main/cpp/CMakeLists.txt); the
          # b3500-era flat-file flattening cannot cover the modern
          # multi-file src/ + ggml layout (ggml-base/ggml-cpu split,
          # ~40 src/*.cpp files). Bump the pin by editing
          # tools/llama-pin.txt only — no workflow change needed.
          LLAMA_TAG="$(tr -d '[:space:]' < tools/llama-pin.txt)"
          echo "llama.cpp pin: ${LLAMA_TAG}"
          git clone --depth 1 --branch "${LLAMA_TAG}" https://github.com/ggml-org/llama.cpp.git /tmp/llama-src
          rm -rf ime-ai/src/main/cpp/llama.cpp
          mkdir -p ime-ai/src/main/cpp/llama.cpp
          cp -r /tmp/llama-src/. ime-ai/src/main/cpp/llama.cpp/
          rm -rf ime-ai/src/main/cpp/llama.cpp/.git
          echo "--- llama.cpp tree ---"
          ls ime-ai/src/main/cpp/llama.cpp
          ls ime-ai/src/main/cpp/llama.cpp/src/llama-vocab.cpp

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Remove Termux aapt2 override
        run: sed -i '/android.aapt2FromMavenOverride/d' gradle.properties

      - name: Configure release signing
        env:
          NACRE_RELEASE_KEYSTORE_BASE64: ${{ secrets.NACRE_RELEASE_KEYSTORE_BASE64 }}
          NACRE_RELEASE_STORE_PASSWORD: ${{ secrets.NACRE_RELEASE_STORE_PASSWORD }}
          NACRE_RELEASE_KEY_ALIAS: ${{ secrets.NACRE_RELEASE_KEY_ALIAS }}
          NACRE_RELEASE_KEY_PASSWORD: ${{ secrets.NACRE_RELEASE_KEY_PASSWORD }}
        run: |
          missing=0
          for name in \
            NACRE_RELEASE_KEYSTORE_BASE64 \
            NACRE_RELEASE_STORE_PASSWORD \
            NACRE_RELEASE_KEY_ALIAS \
            NACRE_RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::warning::${name} is not configured; CI will build but not upload an installable APK."
              missing=1
            fi
          done

          if [ "${missing}" -ne 0 ]; then
            echo "NACRE_SIGNED_APK=false" >> "${GITHUB_ENV}"
            exit 0
          fi

          echo "${NACRE_RELEASE_KEYSTORE_BASE64}" | base64 --decode > /tmp/nacre-release.jks
          {
            printf '%s\n' "storeFile=/tmp/nacre-release.jks"
            printf '%s\n' "storePassword=${NACRE_RELEASE_STORE_PASSWORD}"
            printf '%s\n' "keyAlias=${NACRE_RELEASE_KEY_ALIAS}"
            printf '%s\n' "keyPassword=${NACRE_RELEASE_KEY_PASSWORD}"
          } > signing.properties
          echo "NACRE_SIGNED_APK=true" >> "${GITHUB_ENV}"

      - name: Compute version code
        run: |
          # Monotonic per-run versionCode so the in-app updater can compare builds.
          # +100 keeps us clear of the legacy hand-set codes (<= 2).
          VC=$((100 + GITHUB_RUN_NUMBER))
          echo "NACRE_VERSION_CODE=${VC}" >> "${GITHUB_ENV}"
          echo "NACRE_VERSION_NAME=0.4.1" >> "${GITHUB_ENV}"
          echo "versionCode=${VC} versionName=0.4.1"

      - name: Build Nacre APK
        run: ./gradlew assembleNacre
        env:
          ENABLE_NDK: "true"
          NACRE_VERSION_CODE: ${{ env.NACRE_VERSION_CODE }}
          NACRE_VERSION_NAME: ${{ env.NACRE_VERSION_NAME }}

      - name: Verify native library included
        run: |
          echo "=== Checking for libnacre-ai.so ==="
          find app/build/outputs/apk/release -name "*.apk" -exec unzip -l {} \; | grep libnacre || echo "WARNING: libnacre-ai.so not found in APK"

      - name: Verify release APK signature
        if: env.NACRE_SIGNED_APK == 'true'
        run: |
          APK="$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)"
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort | tail -n 1)"
          "${APKSIGNER}" verify --print-certs "${APK}"

      - name: Upload Nacre APK
        if: env.NACRE_SIGNED_APK == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nacre-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish GitHub Release (in-app updater channel)
        if: env.NACRE_SIGNED_APK == 'true' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK="$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)"
          VC="${NACRE_VERSION_CODE}"
          ASSET="nacre-${VC}.apk"   # name parsed by UpdateChecker (nacre-<code>.apk)
          cp "${APK}" "${ASSET}"
          gh release create "build-${VC}" "${ASSET}" \
            --title "Nacre build ${VC}" \
            --notes "Automated build ${VC} from ${GITHUB_SHA::7} (${GITHUB_REF_NAME})" \
            --target "${GITHUB_SHA}" \
          || gh release upload "build-${VC}" "${ASSET}" --clobber
